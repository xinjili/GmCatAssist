apply plugin: 'com.android.application'

android {
    namespace 'com.gmcat.assist'
    compileSdk 34

    defaultConfig {
        applicationId "com.gmcat.assist"
        minSdk 29
        targetSdk 34
        versionCode 12
        versionName "2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装，免去配置 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*', 'DebugProbesKt.bin']
        }
    }
}
